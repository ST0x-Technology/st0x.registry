version: 6
networks:
  base:
    rpcs:
      - https://mainnet.base.org
      - https://base.drpc.org
      - https://base-rpc.publicnode.com
      - https://developer-access-mainnet.base.org
    chain-id: 8453
    network-id: 8453
    currency: ETH
  ethereum:
    rpcs:
      - https://ethereum-rpc.publicnode.com
      - https://eth.drpc.org
    chain-id: 1
    network-id: 1
    currency: ETH
  hyperevm:
    rpcs:
      - https://rpc.hyperliquid.xyz/evm
    chain-id: 999
    network-id: 999
    currency: HYPE
  robinhood:
    rpcs:
      - https://rpc.mainnet.chain.robinhood.com
      - https://robinhood-rpc.publicnode.com
    chain-id: 4663
    network-id: 4663
    currency: ETH
subgraphs:
  base: https://subgraph.api.ormilabs.com/api/public/9f4fc2fa-4a15-44f7-a7c1-66fdaa518a71/subgraphs/raindex-base/prod/gn
  sft-base: https://api.goldsky.com/api/public/project_cmjr2df7svg6t01tl2ic706ao/subgraphs/sft-base/1.0.14/gn
  sft-ethereum: https://api.goldsky.com/api/public/project_cmjr2df7svg6t01tl2ic706ao/subgraphs/sft-mainnet/1.0.14/gn
  sft-hyperevm: https://api.goldsky.com/api/public/project_cmjr2df7svg6t01tl2ic706ao/subgraphs/sft-hyperevm/bac8721f59eac2e49c3379fecfac925a07a80da8/gn
  # PLACEHOLDER. Ormi have not stood a Raindex subgraph up on 4663 yet, but the
  # schema requires every raindex entry to name one, so `raindexes.robinhood`
  # cannot omit it and the whole settings file fails to parse without this key.
  #
  # `.invalid` is the RFC 2606 reserved TLD and is guaranteed never to resolve,
  # which is the entire point: anything that actually queries this FAILS, loudly
  # and immediately. The alternative - pointing it at Base's subgraph to satisfy
  # the schema - would answer a Robinhood query with Base orders and look like it
  # worked. Replace with the real Ormi endpoint the moment it exists.
  robinhood: https://raindex-robinhood-subgraph-pending-ormi.invalid/gn
metaboards:
  base: https://api.goldsky.com/api/public/project_clv14x04y9kzi01saerx7bxpg/subgraphs/metadata-base/2025-07-06-594f/gn
raindexes:
  base:
    address: 0xe522cB4a5fCb2eb31a52Ff41a4653d85A4fd7C9D
    network: base
    subgraph: base
    deployment-block: 41747644
    local-db-remote: raindex
  robinhood:
    # The canonical RaindexV6 used on every chain except Base, which is still
    # on the older 0xe522cB4a. Verified on 4663 with eth_getCode; the deploy
    # block is bisected from the same, 2026-09-10.
    address: 0x37FC0EFec37D19f8A221aa4F8F7600C9ba2AcD20
    network: robinhood
    deployment-block: 59557818
    # Required by the schema - a raindex entry without one fails the whole
    # settings parse. See the `subgraphs.robinhood` note: it is a deliberately
    # unresolvable placeholder, NOT Base's endpoint.
    subgraph: robinhood
    # No `local-db-remote:`. That bootstrap snapshot is Base-specific and there
    # is no Robinhood equivalent; it is optional, so it stays absent.
rainlangs:
  base:
    address: 0x22508460712C350e914b49155982d3A92D923b10
    network: base
  robinhood:
    address: 0x2DdEa6131E0e46536c6b658D5ACFf922E6133be5
    network: robinhood
local-db-remotes:
  raindex: https://raindex-bootstrap-db.lon1.digitaloceanspaces.com/local-db-manifests/1779881382550/manifest.yaml
local-db-sync:
  base:
    batch-size: 50
    max-concurrent-batches: 1
    retry-attempts: 3
    retry-delay-ms: 1000
    rate-limit-delay-ms: 5000
    finality-depth: 4
    bootstrap-block-threshold: 300
    sync-interval-ms: 5000
using-tokens-from:
  - https://raw.githubusercontent.com/ST0x-Technology/st0x.registry/d2acd5fababdf8e63bc3d9f1d6b19b5431279b4b/token-lists/base.json
  - https://raw.githubusercontent.com/ST0x-Technology/st0x.registry/d2acd5fababdf8e63bc3d9f1d6b19b5431279b4b/token-lists/base-quotes.json
  - https://raw.githubusercontent.com/ST0x-Technology/st0x.registry/d2acd5fababdf8e63bc3d9f1d6b19b5431279b4b/token-lists/ethereum.json
  - https://raw.githubusercontent.com/ST0x-Technology/st0x.registry/d2acd5fababdf8e63bc3d9f1d6b19b5431279b4b/token-lists/ethereum-quotes.json
  - https://raw.githubusercontent.com/ST0x-Technology/st0x.registry/d2acd5fababdf8e63bc3d9f1d6b19b5431279b4b/token-lists/hyperevm.json
  - https://raw.githubusercontent.com/ST0x-Technology/st0x.registry/d2acd5fababdf8e63bc3d9f1d6b19b5431279b4b/token-lists/hyperevm-quotes.json
  - https://raw.githubusercontent.com/ST0x-Technology/st0x.registry/b38a90a0007df94ce9a716564b7cafb413c5e6af/token-lists/robinhood.json
  - https://raw.githubusercontent.com/ST0x-Technology/st0x.registry/b38a90a0007df94ce9a716564b7cafb413c5e6af/token-lists/robinhood-quotes.json
