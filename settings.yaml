raindexes:
  base:
    address: 0xe522cB4a5fCb2eb31a52Ff41a4653d85A4fd7C9D
    network: base
    subgraph: base
    deployment-block: 41747644
    local-db-remote: raindex
  robinhood:
    # The canonical RaindexV6 used on every chain except Base, which is still
    # on the older 0xe522cB4a. Verified on 4663 with eth_getCode; the deploy
    # block is bisected from the same, 2026-09-10.
    address: 0x37FC0EFec37D19f8A221aa4F8F7600C9ba2AcD20
    network: robinhood
    deployment-block: 59557818
    subgraph: robinhood
    local-db-remote: raindex
  zerog:
    # The same canonical RaindexV6 as on Robinhood. No code on 16661 at the
    # block before deployment-block, code from it on.
    address: 0x37FC0EFec37D19f8A221aa4F8F7600C9ba2AcD20
    network: zerog
    deployment-block: 50763646
    subgraph: zerog
rainlangs:
  base:
    address: 0x22508460712C350e914b49155982d3A92D923b10
    network: base
  robinhood:
    address: 0x2DdEa6131E0e46536c6b658D5ACFf922E6133be5
    network: robinhood
  zerog:
    # The 0_1_9 IRainlang from rainlang.deploy, a newer build than Robinhood's
    # entry above (a different contract, with no code on 16661).
    # It and its parser, interpreter, store and expression deployer have the
    # release record's codehash on 16661.
    address: 0x820FB8ae43350f6F4F60117955751b0a6777aC54
    network: zerog
