name: publish-t0-tokens

on:
  pull_request:
    paths: ["t0/**", ".github/workflows/publish-t0-tokens.yml"]
  push:
    branches: [main]
    paths: ["t0/**", ".github/workflows/publish-t0-tokens.yml"]

concurrency:
  group: publish-t0-tokens-${{ github.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check
        run: |
          set -euo pipefail
          for f in t0/staging.toml t0/production.toml; do
            problems=$(python3 -c 'import json,sys,tomllib; json.dump(tomllib.load(open(sys.argv[1],"rb")), sys.stdout)' "$f" | jq -r -f t0/check.jq)
            [ -z "$problems" ] || { echo "$f:"; echo "$problems"; exit 1; }
          done

      - id: auth
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/684788085322/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
          service_account: tokens-publisher@t0-artifacts.iam.gserviceaccount.com
          token_format: access_token

      - name: Upload
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          for env in staging production; do
            curl --fail-with-body -sS -o /dev/null -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/toml" \
              --data-binary "@t0/${env}.toml" \
              "https://storage.googleapis.com/upload/storage/v1/b/t0-artifacts-tokens/o?uploadType=media&name=${env}%2Ftokens.toml"
          done
