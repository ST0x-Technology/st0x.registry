name: st0x-v6 NAV fork test

# Validates st0x-fixed-spread-v6 vault NAV bind against a live Base order:
# quote+take succeeds when NAV matches; take reverts after a NAV step.
# Strategy lives here; the Foundry fork harness lives in rainlanguage/raindex.

on:
  workflow_dispatch:
    inputs:
      raindex_ref:
        description: raindex git ref that contains RaindexV6St0xNavForkTest
        required: true
        default: feat/st0x-v6-nav-fork-test
  pull_request:
    paths:
      - "src/st0x-fixed-spread-v6.rain"
      - "src/st0x-fixed-spread-v6.md"
      - ".github/workflows/st0x-v6-nav-fork.yml"

permissions:
  contents: read

jobs:
  nav-fork:
    name: RaindexV6St0xNavForkTest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out raindex fork harness
        uses: actions/checkout@v6
        with:
          repository: rainlanguage/raindex
          ref: ${{ inputs.raindex_ref || 'feat/st0x-v6-nav-fork-test' }}
          path: raindex

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Soldeer dependencies
        working-directory: raindex
        run: |
          set -euo pipefail
          forge soldeer install

      - name: Run NAV fork tests
        working-directory: raindex
        env:
          PRIVATE_BASE_RPC_URLS: ${{ secrets.PRIVATE_BASE_RPC_URLS }}
        run: |
          set -euo pipefail

          if [ -z "${PRIVATE_BASE_RPC_URLS}" ]; then
            echo "PRIVATE_BASE_RPC_URLS secret is required" >&2
            exit 1
          fi

          # Secret may be newline- and/or comma-separated; take the first URL.
          BASE_MAINNET_RPC_URL="$(
            printf '%s\n' "${PRIVATE_BASE_RPC_URLS}" \
              | tr ',' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | sed '/^$/d' \
              | head -n1
          )"

          if [ -z "${BASE_MAINNET_RPC_URL}" ]; then
            echo "PRIVATE_BASE_RPC_URLS did not yield a usable RPC URL" >&2
            exit 1
          fi

          export BASE_MAINNET_RPC_URL
          forge test --match-contract RaindexV6St0xNavForkTest -vvv
