name: st0x-v7 NAV fork test

# Validates st0x-fixed-spread-v7 derived vault price against a live Base order:
# quote+take derives underlying x live-NAV; a NAV step re-prices the fill (no revert).
# Strategy lives here; the Foundry fork harness lives in rainlanguage/raindex.

on:
  workflow_dispatch:
    inputs:
      raindex_ref:
        description: raindex git ref that contains RaindexV7St0xNavForkTest
        required: true
        default: feat/st0x-v7-nav-fork-test
  pull_request:
    paths:
      - "src/st0x-fixed-spread-v7.rain"
      - "src/st0x-fixed-spread-v7.md"
      - ".github/workflows/st0x-v7-nav-fork.yml"

permissions:
  contents: read

jobs:
  nav-fork:
    name: RaindexV7St0xNavForkTest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out raindex fork harness
        uses: actions/checkout@v6
        with:
          repository: rainlanguage/raindex
          ref: ${{ inputs.raindex_ref || 'feat/st0x-v7-nav-fork-test' }}
          path: raindex

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Soldeer dependencies
        working-directory: raindex
        run: |
          set -euo pipefail
          forge soldeer install

      - name: Run NAV fork tests
        working-directory: raindex
        env:
          PRIVATE_BASE_RPC_URLS: ${{ secrets.PRIVATE_BASE_RPC_URLS }}
        run: |
          set -euo pipefail

          rpc_ok() {
            local url="$1"
            local body
            body="$(
              curl -sS --max-time 10 -X POST "$url" \
                -H 'content-type: application/json' \
                --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
                || true
            )"
            printf '%s' "$body" | grep -q '"result"'
          }

          candidates="$(
            {
              printf '%s\n' "${PRIVATE_BASE_RPC_URLS:-}"
              printf '%s\n' "https://mainnet.base.org"
            } | tr ',' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | sed '/^$/d'
          )"

          BASE_MAINNET_RPC_URL=""
          while IFS= read -r url; do
            if rpc_ok "$url"; then
              BASE_MAINNET_RPC_URL="$url"
              break
            fi
            echo "skipping non-eth RPC candidate" >&2
          done <<< "$candidates"

          if [ -z "${BASE_MAINNET_RPC_URL}" ]; then
            echo "no usable Base eth JSON-RPC among PRIVATE_BASE_RPC_URLS / public fallback" >&2
            exit 1
          fi

          export BASE_MAINNET_RPC_URL
          forge test --match-contract RaindexV7St0xNavForkTest -vvv
