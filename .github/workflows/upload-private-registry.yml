name: Upload private registry

on:
  workflow_dispatch:
    inputs:
      target:
        description: "API environment to update"
        required: true
        type: choice
        default: "staging"
        options:
          - staging
          - production
      rpc_proxy:
        description: "Make the API's local RPC failover proxy the only Base and Robinhood RPC. Only after that API's latest deploy log, step Check RPC proxy, shows a head for both 8453 and 4663 and no 'not installed' warning"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    name: Upload private registry artifact
    runs-on: ubuntu-latest
    # One upload per target at a time, so a rollback (rpc_proxy off) never
    # lands before a proxy upload that was still in flight.
    concurrency:
      group: upload-private-registry-${{ inputs.target }}
      cancel-in-progress: false
    # Environment secrets override the repo-level ones of the same name, so
    # each API gets its own RPC URLs (one Alchemy app per deployment) while a
    # target without its own PRIVATE_*_RPC_URLS falls back to the repo secret.
    environment: ${{ inputs.target }}
    steps:
      - name: Validate target branch
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          if [ "${TARGET}" = "production" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Production registry uploads must run from main, got ${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Check out registry
        uses: actions/checkout@v6

      - name: Build private registry artifact
        env:
          RPC_PROXY: ${{ inputs.rpc_proxy }}
          PRIVATE_BASE_RPC_URLS: ${{ secrets.PRIVATE_BASE_RPC_URLS }}
          PRIVATE_ROBINHOOD_RPC_URLS: ${{ secrets.PRIVATE_ROBINHOOD_RPC_URLS }}
        run: |
          set -euo pipefail

          # The API runs eRPC on 127.0.0.1:4000 (st0x.rest.api nix/rpc-proxy.nix):
          # per request it tries our own node, then the public RPCs, then the
          # deployment's own Alchemy app, whose key lives on the droplet, not
          # here. The proxy is then the ONLY RPC for those chains: the API's
          # RPC client sends every request to every listed URL in parallel,
          # so a public RPC listed after the proxy would be called directly
          # too (twice the public load, more throttling, more Alchemy).
          replace_rpcs=()
          if [ "${RPC_PROXY}" = "true" ]; then
            PRIVATE_BASE_RPC_URLS="http://127.0.0.1:4000/main/evm/8453"
            PRIVATE_ROBINHOOD_RPC_URLS="http://127.0.0.1:4000/main/evm/4663"
            replace_rpcs=(--replace-rpcs)
          fi

          if [ -z "${PRIVATE_BASE_RPC_URLS}" ]; then
            echo "PRIVATE_BASE_RPC_URLS secret is required" >&2
            exit 1
          fi
          if [ -z "${PRIVATE_ROBINHOOD_RPC_URLS}" ]; then
            echo "PRIVATE_ROBINHOOD_RPC_URLS secret is required" >&2
            exit 1
          fi

          scripts/build-private-registry-artifact.sh \
            --private-base-rpc-urls "${PRIVATE_BASE_RPC_URLS}" \
            --private-robinhood-rpc-urls "${PRIVATE_ROBINHOOD_RPC_URLS}" \
            "${replace_rpcs[@]}" \
            --output "${RUNNER_TEMP}/private-registry-artifact.b64"

          registry_artifact_b64="$(cat "${RUNNER_TEMP}/private-registry-artifact.b64")"
          printf '{"registry_artifact":"data:text/plain;base64,%s","source_commit":"%s"}\n' \
            "${registry_artifact_b64}" \
            "${GITHUB_SHA}" \
            > "${RUNNER_TEMP}/private-registry-upload.json"

      - name: Upload private registry artifact
        env:
          TARGET: ${{ inputs.target }}
          PRODUCTION_ST0X_REST_API_URL: ${{ secrets.ST0X_REST_API_URL }}
          PRODUCTION_ST0X_REST_API_ADMIN_KEY_ID: ${{ secrets.ST0X_REST_API_ADMIN_KEY_ID }}
          PRODUCTION_ST0X_REST_API_ADMIN_SECRET: ${{ secrets.ST0X_REST_API_ADMIN_SECRET }}
          STAGING_ST0X_REST_API_URL: ${{ secrets.STAGING_ST0X_REST_API_URL }}
          STAGING_ST0X_REST_API_ADMIN_KEY_ID: ${{ secrets.STAGING_ST0X_REST_API_ADMIN_KEY_ID }}
          STAGING_ST0X_REST_API_ADMIN_SECRET: ${{ secrets.STAGING_ST0X_REST_API_ADMIN_SECRET }}
        run: |
          set -euo pipefail

          case "${TARGET}" in
            production)
              api_url="${PRODUCTION_ST0X_REST_API_URL}"
              admin_key_id="${PRODUCTION_ST0X_REST_API_ADMIN_KEY_ID}"
              admin_secret="${PRODUCTION_ST0X_REST_API_ADMIN_SECRET}"
              ;;
            staging)
              api_url="${STAGING_ST0X_REST_API_URL}"
              admin_key_id="${STAGING_ST0X_REST_API_ADMIN_KEY_ID}"
              admin_secret="${STAGING_ST0X_REST_API_ADMIN_SECRET}"
              ;;
            *)
              echo "Unsupported target: ${TARGET}" >&2
              exit 1
              ;;
          esac

          if [ -z "${api_url}" ]; then
            echo "${TARGET} API URL secret is required" >&2
            exit 1
          fi
          if [ -z "${admin_key_id}" ]; then
            echo "${TARGET} API admin key ID secret is required" >&2
            exit 1
          fi
          if [ -z "${admin_secret}" ]; then
            echo "${TARGET} API admin secret is required" >&2
            exit 1
          fi

          api_url="${api_url%/}"
          curl --silent --show-error --fail \
            --request PUT "${api_url}/admin/registry" \
            --user "${admin_key_id}:${admin_secret}" \
            --header "Content-Type: application/json" \
            --data-binary "@${RUNNER_TEMP}/private-registry-upload.json" \
            --output /dev/null

          echo "Uploaded private registry artifact for ${GITHUB_SHA} to ${TARGET}"
